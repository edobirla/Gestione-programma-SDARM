name: Build Windows package

# Costruisce l'app per Windows nel cloud, senza bisogno di Python su
# nessun PC tuo. Si avvia da solo a ogni "push" su main, oppure a mano dal
# tab "Actions" del repository (pulsante "Run workflow").
#
# Al termine (2-3 minuti), apri la run in "Actions", scorri fino in fondo
# alla pagina: sotto "Artifacts" trovi "windows-build" da scaricare — è lo
# zip pronto da copiare sul PC della chiesa (nessuna installazione di
# Python richiesta lì).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build (PyInstaller)
        run: pyinstaller packaging/ProgrammaServizio.spec --noconfirm --distpath dist --workpath build

      - name: Zip di distribuzione
        run: Compress-Archive -Path "dist/Gestione programma SDARM" -DestinationPath "dist/Gestione programma SDARM-windows.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/Gestione programma SDARM-windows.zip
